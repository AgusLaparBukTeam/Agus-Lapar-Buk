services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gateguard
      POSTGRES_USER: gateguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - gateguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateguard -d gateguard"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://gateguard:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/gateguard
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://gateguard:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/gateguard
    command: ["python", "-m", "scripts.seed_users"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://gateguard:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/gateguard
      CORS_ORIGINS: ${APP_PUBLIC_ORIGIN:?APP_PUBLIC_ORIGIN is required}
      DOCUMENT_STORAGE_ROOT: /data/documents
    expose:
      - "8000"
    volumes:
      - gateguard-documents:/data
    tmpfs:
      - /tmp:size=256m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://gateguard:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/gateguard
      DOCUMENT_STORAGE_ROOT: /data/documents
    command: ["python", "-m", "app.worker"]
    volumes:
      - gateguard-documents:/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      BACKEND_API_URL: http://backend:8000
      BACKEND_API_KEY: ${APP_API_KEY:?APP_API_KEY is required}
      BACKEND_TIMEOUT_MS: ${BACKEND_TIMEOUT_MS:-60000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  gateguard-postgres:
  gateguard-documents:
