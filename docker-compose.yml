services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/gateguard.db
      CORS_ORIGINS: http://localhost:3000
    # Loopback-only: the browser should reach the API through the Next.js BFF.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - gateguard-data:/data
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - .env
    environment:
      BACKEND_API_URL: http://backend:8000
      BACKEND_API_KEY: ${APP_API_KEY:-}
      BACKEND_TIMEOUT_MS: ${BACKEND_TIMEOUT_MS:-60000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  gateguard-data:
