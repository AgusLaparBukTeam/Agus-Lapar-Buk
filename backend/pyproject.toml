[project]
name = "gateguard-backend"
version = "0.1.0"
description = "Pre-dispatch shipment document reconciliation API"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "sqlalchemy==2.0.52",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "rapidfuzz>=3.14,<4",
  "pypdf>=6,<7",
  "pdfplumber>=0.11,<1",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.18,<2",
  "argon2-cffi>=25.1,<26",
  "cryptography>=50,<51",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "reportlab>=4.4,<5",
]
ocr = [
  "paddleocr[doc-parser]>=3.5,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
