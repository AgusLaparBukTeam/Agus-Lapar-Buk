#cloud-config
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - git
  - docker.io
  - docker-compose-v2
  - fail2ban
  - ufw
runcmd:
  - [ sh, -c, "fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048" ]
  - [ chmod, '600', /swapfile ]
  - [ mkswap, /swapfile ]
  - [ swapon, /swapfile ]
  - [ sh, -c, "grep -q '^/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab" ]
  - [ usermod, -aG, docker, gateguardadmin ]
  - [ systemctl, enable, --now, docker ]
  - [ ufw, default, deny, incoming ]
  - [ ufw, default, allow, outgoing ]
  - [ ufw, allow, 22/tcp ]
  - [ ufw, allow, 80/tcp ]
  - [ ufw, --force, enable ]
  - [ systemctl, enable, --now, fail2ban ]
write_files:
  - path: /etc/docker/daemon.json
    permissions: '0644'
    content: |
      {
        "log-driver": "local",
        "log-opts": {"max-size": "10m", "max-file": "3"}
      }
