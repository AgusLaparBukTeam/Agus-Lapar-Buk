name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv==0.10.0

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --extra dev

      - name: Lint
        working-directory: backend
        run: uv run ruff check app tests

      - name: Test
        working-directory: backend
        run: uv run pytest --cov=app --cov-report=term-missing

      - name: Migration smoke test
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/gateguard-ci.db
        run: rm -f /tmp/gateguard-ci.db && uv run alembic upgrade head

      - name: Reconciliation evaluation
        working-directory: backend
        run: uv run python ../evaluation/run.py

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --include=dev

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Prepare compose environment
        run: cp .env.example .env

      - name: Validate development Compose configuration
        run: docker compose config

      - name: Validate production Compose configuration
        env:
          APP_API_KEY: ci-service-key-012345678901234567890123456789
          APP_PUBLIC_ORIGIN: https://gateguard.example.com
          POSTGRES_PASSWORD: ci-postgres-password
          SEED_USER_1_EMAIL: admin@gateguard.local
          SEED_USER_1_PASSWORD: ci-seed-password-1
          SEED_USER_1_DISPLAY_NAME: GateGuard Admin
          SEED_USER_1_ROLE: admin
          SEED_USER_2_EMAIL: operator@gateguard.local
          SEED_USER_2_PASSWORD: ci-seed-password-2
          SEED_USER_2_DISPLAY_NAME: GateGuard Operator
          SEED_USER_2_ROLE: operator
        run: docker compose -f docker-compose.prod.yml config

      - name: Remove temporary compose environment
        if: always()
        run: rm -f .env
