name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv==0.10.0

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --extra dev

      - name: Lint
        working-directory: backend
        run: uv run ruff check app tests

      - name: Test
        working-directory: backend
        run: uv run pytest --cov=app --cov-report=term-missing

      - name: Migration smoke test
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/gateguard-ci.db
        run: rm -f /tmp/gateguard-ci.db && uv run alembic upgrade head

      - name: Reconciliation evaluation
        working-directory: backend
        run: uv run python ../evaluation/run.py

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --include=dev

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Prepare compose environment
        run: cp .env.example .env

      - name: Validate development Compose configuration
        run: docker compose config

      - name: Validate production Compose configuration
        env:
          APP_API_KEY: ci-service-key-012345678901234567890123456789
          APP_PUBLIC_ORIGIN: https://gateguard.example.com
          POSTGRES_PASSWORD: ci-postgres-password
        run: docker compose -f docker-compose.prod.yml config

      - name: Remove temporary compose environment
        if: always()
        run: rm -f .env

      - name: Deploy production to VPS
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/gateguard_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/gateguard_deploy" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/gateguard_deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/gateguard
          git fetch --prune origin main
          git checkout --force main
          git reset --hard origin/main
          docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

          for attempt in $(seq 1 36); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' gateguard-postgres-1 2>/dev/null)" = healthy ] \
              && [ "$(docker inspect --format '{{.State.Health.Status}}' gateguard-backend-1 2>/dev/null)" = healthy ] \
              && curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "GateGuard deployment is healthy."
              exit 0
            fi
            sleep 5
          done

          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml logs --tail=80
          exit 1
          REMOTE
