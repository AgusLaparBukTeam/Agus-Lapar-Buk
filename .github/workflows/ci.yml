name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv==0.10.0
      - name: Install dependencies
        working-directory: backend
        run: uv sync --extra dev
      - name: Lint
        working-directory: backend
        run: uv run ruff check app tests
      - name: Test
        working-directory: backend
        run: uv run pytest --cov=app --cov-report=term-missing
      - name: Migration smoke test
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/gateguard-ci.db
        run: uv run alembic upgrade head
      - name: Reconciliation evaluation
        working-directory: backend
        run: uv run python ../evaluation/run.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
