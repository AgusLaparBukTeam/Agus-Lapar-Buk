name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv==0.10.0

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --extra dev

      - name: Lint
        working-directory: backend
        run: uv run ruff check app tests

      - name: Test with coverage floor
        working-directory: backend
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Audit Python dependencies
        working-directory: backend
        run: uv tool run pip-audit .

      - name: Run Semgrep OSS SAST
        run: uv tool run semgrep scan --config p/default --error --metrics=off backend/app frontend/app frontend/components frontend/lib

      - name: Migration smoke test
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/gateguard-ci.db
        run: rm -f /tmp/gateguard-ci.db && uv run alembic upgrade head

      - name: Reconciliation evaluation
        working-directory: backend
        run: uv run python ../evaluation/run.py

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --include=dev

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Audit production npm dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Prepare compose environment
        run: cp .env.example .env

      - name: Validate development Compose configuration
        run: docker compose config

      - name: Validate production Compose configuration
        env:
          APP_API_KEY: ci-service-key-012345678901234567890123456789
          APP_PUBLIC_ORIGIN: https://gateguard.example.com
          POSTGRES_PASSWORD: ci-postgres-password
          SEED_USER_1_EMAIL: admin@gateguard.local
          SEED_USER_1_PASSWORD: ci-seed-password-1
          SEED_USER_1_DISPLAY_NAME: GateGuard Admin
          SEED_USER_1_ROLE: admin
          SEED_USER_2_EMAIL: operator@gateguard.local
          SEED_USER_2_PASSWORD: ci-seed-password-2
          SEED_USER_2_DISPLAY_NAME: GateGuard Operator
          SEED_USER_2_ROLE: operator
        run: docker compose -f docker-compose.prod.yml config

      - name: Validate image-release Compose configuration
        env:
          APP_API_KEY: ci-service-key-012345678901234567890123456789
          APP_PUBLIC_ORIGIN: https://gateguard.example.com
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ci-image-sha
          POSTGRES_PASSWORD: ci-postgres-password
          SEED_USER_1_EMAIL: admin@gateguard.local
          SEED_USER_1_PASSWORD: ci-seed-password-1
          SEED_USER_1_DISPLAY_NAME: GateGuard Admin
          SEED_USER_1_ROLE: admin
          SEED_USER_2_EMAIL: operator@gateguard.local
          SEED_USER_2_PASSWORD: ci-seed-password-2
          SEED_USER_2_DISPLAY_NAME: GateGuard Operator
          SEED_USER_2_ROLE: operator
        run: docker compose -f docker-compose.prod.yml -f docker-compose.prod.images.yml config

      - name: Remove temporary compose environment
        if: always()
        run: rm -f .env

  supply-chain-security:
    name: Supply-chain security
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Scan tracked secrets with Gitleaks CLI
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}:/repo:ro"
          zricethezav/gitleaks:v8.23.3
          detect --source=/repo --redact --no-banner --exit-code=1

      - name: Scan repository vulnerabilities and IaC with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate source SBOM artifact
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          artifact-name: gateguard-source-sbom
          output-file: gateguard-source.spdx.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build backend image for vulnerability scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: gateguard-backend:ci

      - name: Scan backend container image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: gateguard-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'
          skip-setup-trivy: true

      - name: Build frontend image for vulnerability scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: gateguard-frontend:ci

      - name: Scan frontend container image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: gateguard-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'
          skip-setup-trivy: true

  publish-production-images:
    name: Publish production images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, supply-chain-security]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Normalize GHCR image owner
        id: image-owner
        run: echo "value=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build and publish backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.image-owner.outputs.value }}/gateguard-backend:${{ github.sha }}
            ghcr.io/${{ steps.image-owner.outputs.value }}/gateguard-backend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.image-owner.outputs.value }}/gateguard-frontend:${{ github.sha }}
            ghcr.io/${{ steps.image-owner.outputs.value }}/gateguard-frontend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
