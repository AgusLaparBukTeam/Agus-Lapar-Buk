name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv==0.10.0

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --extra dev

      - name: Lint
        working-directory: backend
        run: uv run ruff check app tests

      - name: Test
        working-directory: backend
        run: uv run pytest --cov=app --cov-report=term-missing

      - name: Migration smoke test
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/gateguard-ci.db
        run: rm -f /tmp/gateguard-ci.db && uv run alembic upgrade head

      - name: Reconciliation evaluation
        working-directory: backend
        run: uv run python ../evaluation/run.py

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --include=dev

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Prepare compose environment
        run: cp .env.example .env

      - name: Validate development Compose configuration
        run: docker compose config

      - name: Validate production Compose configuration
        env:
          APP_API_KEY: ci-service-key-012345678901234567890123456789
          APP_PUBLIC_ORIGIN: https://gateguard.example.com
          POSTGRES_PASSWORD: ci-postgres-password
          SEED_USER_1_EMAIL: admin@gateguard.local
          SEED_USER_1_PASSWORD: ci-seed-password-1
          SEED_USER_1_DISPLAY_NAME: GateGuard Admin
          SEED_USER_1_ROLE: admin
          SEED_USER_2_EMAIL: operator@gateguard.local
          SEED_USER_2_PASSWORD: ci-seed-password-2
          SEED_USER_2_DISPLAY_NAME: GateGuard Operator
          SEED_USER_2_ROLE: operator
        run: docker compose -f docker-compose.prod.yml config

      - name: Validate image-release Compose configuration
        env:
          APP_API_KEY: ci-service-key-012345678901234567890123456789
          APP_PUBLIC_ORIGIN: https://gateguard.example.com
          IMAGE_TAG: ci-image-sha
          POSTGRES_PASSWORD: ci-postgres-password
          SEED_USER_1_EMAIL: admin@gateguard.local
          SEED_USER_1_PASSWORD: ci-seed-password-1
          SEED_USER_1_DISPLAY_NAME: GateGuard Admin
          SEED_USER_1_ROLE: admin
          SEED_USER_2_EMAIL: operator@gateguard.local
          SEED_USER_2_PASSWORD: ci-seed-password-2
          SEED_USER_2_DISPLAY_NAME: GateGuard Operator
          SEED_USER_2_ROLE: operator
        run: docker compose -f docker-compose.prod.yml -f docker-compose.prod.images.yml config

      - name: Remove temporary compose environment
        if: always()
        run: rm -f .env

  publish-production-images:
    name: Publish production images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/aguslaparbukteam/gateguard-backend:${{ github.sha }}
            ghcr.io/aguslaparbukteam/gateguard-backend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/aguslaparbukteam/gateguard-frontend:${{ github.sha }}
            ghcr.io/aguslaparbukteam/gateguard-frontend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
